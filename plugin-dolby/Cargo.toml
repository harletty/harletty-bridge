[package]
name = "harletty-dolby-bridge"
version = "0.8.0"
edition = "2024"
# Links bridge_api, like ../bridge: see the note there.
license = "GPL-3.0-or-later"
description = "harletty-bridge as an Omniphony bridge plugin for the Dolby family: TrueHD and E-AC-3 / AC-3 with their objects"
repository = "https://github.com/harletty/harletty-bridge"
publish = false

# cdylib: the plugin a host loads. rlib: what its tests link.
[lib]
name = "harletty_dolby_bridge"
crate-type = ["cdylib", "rlib"]

[features]
# Per-stage timings of the TrueHD and E-AC-3 paths (TRUEHD_BRIDGE_PERF_*).
bridge-perf = ["bridge-family-dolby/bridge-perf"]

[dependencies]
bridge_api = { version = "0.6.0", path = "../../Omniphony/omniphony-renderer/bridge_api" }
bridge-common = { version = "0.8.0", path = "../bridge-common" }
bridge-family-dolby = { version = "0.8.0", path = "../bridge-family-dolby" }
abi_stable = "0.11"
