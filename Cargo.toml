[workspace]
members = ["truehd", "eac3"]
resolver = "2"

[package]
name = "harletty-bridge"
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"

# cdylib: loadable .so/.dll   rlib: linkable by tests / static fallback
[lib]
name = "harletty_bridge"
crate-type = ["cdylib", "rlib"]

[features]
default = []
bridge-perf = []

[dependencies]
bridge_api = { version = "0.2.0", path = "../Omniphony/omniphony-renderer/bridge_api" }
spdif = { version = "0.1.0", path = "../Omniphony/omniphony-renderer/spdif" }
sys = { version = "0.1.0", path = "../Omniphony/omniphony-renderer/sys" }
truehd = { version = "0.5.0", path = "truehd" }
eac3 = { version = "0.5.0", path = "eac3" }
abi_stable = "0.11"
log = "0.4"
anyhow = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
