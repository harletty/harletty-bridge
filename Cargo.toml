# Virtual workspace: the repo produces two independent artifacts from one
# decoder lineage — `bridge` (the realtime cdylib plugin) and, from phase 2 on,
# `truehdd` (the offline ADM/DAMF CLI). Isolation between them is by crate
# graph, not feature flags: `bridge` must never pull in CLI-side crates and the
# CLI must never pull in the Omniphony bridge ABI. See
# docs/plan-truehdd-resurrection-in-harletty.md.
[workspace]
members = ["bridge", "truehd", "eac3", "dca", "damf", "truehdd-macros"]
resolver = "2"
