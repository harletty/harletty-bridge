[package]
name = "harletty-dts-bridge"
version = "0.9.0"
edition = "2024"
# Links bridge_api, like ../bridge: see the note there.
license = "GPL-3.0-or-later"
description = "harletty-bridge as an Omniphony bridge plugin for the DTS family: DTS, DTS-HD, DTS:X and Auro-3D over DTS-HD MA"
repository = "https://github.com/harletty/harletty-bridge"
publish = false

# cdylib: the plugin a host loads. rlib: what its tests link.
[lib]
name = "harletty_dts_bridge"
crate-type = ["cdylib", "rlib"]

[dependencies]
bridge_api = { version = "0.6.0", path = "../../Omniphony/omniphony-renderer/bridge_api" }
bridge-common = { version = "0.9.0", path = "../bridge-common" }
bridge-family-dts = { version = "0.9.0", path = "../bridge-family-dts" }
abi_stable = "0.11"
