[package]
name = "harletty-iamf-bridge"
version = "0.9.0"
edition = "2024"
# Links bridge_api, like ../bridge: see the note there.
license = "GPL-3.0-or-later"
description = "harletty-bridge as an Omniphony bridge plugin for IAMF (AOMedia Immersive Audio Model and Formats)"
repository = "https://github.com/harletty/harletty-bridge"
publish = false

# cdylib: the plugin a host loads. rlib: what its tests link.
[lib]
name = "harletty_iamf_bridge"
crate-type = ["cdylib", "rlib"]

[dependencies]
bridge_api = { version = "0.6.0", path = "../../Omniphony/omniphony-renderer/bridge_api" }
bridge-common = { version = "0.9.0", path = "../bridge-common" }
bridge-family-iamf = { version = "0.9.0", path = "../bridge-family-iamf" }
abi_stable = "0.11"
