[package]
name = "harletty-bridge"
version = "0.7.4"
edition = "2024"
# The sources in this crate are Apache-2.0 like the rest of the workspace, but
# the built library links bridge_api, spdif and sys from Omniphony, which are
# GPL-3.0-or-later. The result is a combined work that can only be distributed
# under the GPL, so that is what this field states — it describes what you may
# do with the artifact, not who wrote which line. The CLI (../harletty) has no
# such dependency and stays Apache-2.0.
license = "GPL-3.0-or-later"

# cdylib: loadable .so/.dll   rlib: linkable by tests / static fallback
[lib]
name = "harletty_bridge"
crate-type = ["cdylib", "rlib"]

[features]
default = []
bridge-perf = ["truehd/perf"]

# Path deps reach out of the workspace to the sibling Omniphony checkout:
# `bridge/../../Omniphony` is the workflow symlink locally and the second
# checkout in CI.
[dependencies]
bridge_api = { version = "0.3.0", path = "../../Omniphony/omniphony-renderer/bridge_api" }
spdif = { version = "0.1.0", path = "../../Omniphony/omniphony-renderer/spdif" }
sys = { version = "0.1.0", path = "../../Omniphony/omniphony-renderer/sys" }
truehd = { version = "0.7.1" }
eac3 = { version = "0.7.4", path = "../eac3" }
dca = { version = "0.7.4", path = "../dca" }
abi_stable = "0.11"
log = "0.4"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
