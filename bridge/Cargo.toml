[package]
name = "harletty-bridge"
version = "0.8.0"
edition = "2024"
# The sources in this crate are Apache-2.0 like the rest of the workspace, but
# the built library links bridge_api from Omniphony, which is
# GPL-3.0-or-later. The result is a combined work that can only be distributed
# under the GPL, so that is what this field states — it describes what you may
# do with the artifact, not who wrote which line. The CLI (../harletty) has no
# such dependency and stays Apache-2.0.
license = "GPL-3.0-or-later"

# cdylib: loadable .so/.dll   rlib: linkable by tests / static fallback
[lib]
name = "harletty_bridge"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Per-stage timings of the Dolby paths (TRUEHD_BRIDGE_PERF_*).
bridge-perf = ["bridge-family-dolby/bridge-perf"]
# IAMF (AOMedia Immersive Audio Model and Formats): the bridge-family-iamf
# crate. Off by default: its Opus decoding links libopus (pkg-config, or
# OPUS_LIB_DIR), and the Windows and macOS release builds do not provide one
# yet.
iamf = ["dep:bridge-family-iamf"]

# Path deps reach out of the workspace to the sibling Omniphony checkout:
# `bridge/../../Omniphony` is the workflow symlink locally and the second
# checkout in CI.
[dependencies]
bridge_api = { version = "0.5.0", path = "../../Omniphony/omniphony-renderer/bridge_api" }
bridge-common = { version = "0.8.0", path = "../bridge-common" }
bridge-family-dolby = { version = "0.8.0", path = "../bridge-family-dolby" }
bridge-family-dts = { version = "0.8.0", path = "../bridge-family-dts" }
bridge-family-iamf = { version = "0.8.0", path = "../bridge-family-iamf", optional = true }
abi_stable = "0.11"
log = "0.4"
[dev-dependencies]
serde_json = "1.0.142"
# The IEC 61937 burst parser the live input uses, for `bridge_bench --iec61937`.
spdif = { version = "0.1.0", path = "../../Omniphony/omniphony-renderer/spdif" }
