[package]
name = "harletty-bridge"
version = "0.8.0"
edition = "2024"
# The sources in this crate are Apache-2.0 like the rest of the workspace, but
# the built library links bridge_api from Omniphony, which is
# GPL-3.0-or-later. The result is a combined work that can only be distributed
# under the GPL, so that is what this field states — it describes what you may
# do with the artifact, not who wrote which line. The CLI (../harletty) has no
# such dependency and stays Apache-2.0.
license = "GPL-3.0-or-later"

# cdylib: loadable .so/.dll   rlib: linkable by tests / static fallback
[lib]
name = "harletty_bridge"
crate-type = ["cdylib", "rlib"]

# The codec families this bridge decodes, one crate each; a stream of a family
# left out is refused by name. At least one is needed. An IAMF-only bridge,
# say, is `--no-default-features --features iamf`, and holds no other
# family's decoder (scripts/check-crate-isolation.sh).
[features]
default = ["dolby", "dts"]
# TrueHD, E-AC-3 / AC-3 and their objects: bridge-family-dolby.
dolby = ["dep:bridge-family-dolby"]
# DTS, DTS-HD, DTS:X and Auro-3D over DTS-HD MA: bridge-family-dts.
dts = ["dep:bridge-family-dts"]
# IAMF (AOMedia Immersive Audio Model and Formats): bridge-family-iamf. Off by
# default: its Opus decoding links libopus (pkg-config, or OPUS_LIB_DIR), and
# the Windows and macOS release builds do not provide one yet.
iamf = ["dep:bridge-family-iamf"]
# Per-stage timings of the Dolby paths (TRUEHD_BRIDGE_PERF_*).
bridge-perf = ["bridge-family-dolby?/bridge-perf"]

# Path deps reach out of the workspace to the sibling Omniphony checkout:
# `bridge/../../Omniphony` is the workflow symlink locally and the second
# checkout in CI, at the commit `.omniphony-ref` (repository root) pins.
# build.rs records which commit that was in the library.
[dependencies]
bridge_api = { version = "0.6.0", path = "../../Omniphony/omniphony-renderer/bridge_api" }
bridge-common = { version = "0.8.0", path = "../bridge-common" }
bridge-family-dolby = { version = "0.8.0", path = "../bridge-family-dolby", optional = true }
bridge-family-dts = { version = "0.8.0", path = "../bridge-family-dts", optional = true }
bridge-family-iamf = { version = "0.8.0", path = "../bridge-family-iamf", optional = true }
abi_stable = "0.11"
log = "0.4"
[dev-dependencies]
serde_json = "1.0.142"
# Its EXAMPLE_DATA: a TrueHD stream for the family-bridge comparison.
truehd = { version = "0.7.2" }
# The IEC 61937 burst parser the live input uses, for `bridge_bench --iec61937`.
spdif = { version = "0.1.0", path = "../../Omniphony/omniphony-renderer/spdif" }
