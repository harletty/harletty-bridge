[package]
name = "harletty-bridge"
version = "0.8.0"
edition = "2024"
# The sources in this crate are Apache-2.0 like the rest of the workspace, but
# the built library links bridge_api, spdif and sys from Omniphony, which are
# GPL-3.0-or-later. The result is a combined work that can only be distributed
# under the GPL, so that is what this field states — it describes what you may
# do with the artifact, not who wrote which line. The CLI (../harletty) has no
# such dependency and stays Apache-2.0.
license = "GPL-3.0-or-later"

# cdylib: loadable .so/.dll   rlib: linkable by tests / static fallback
[lib]
name = "harletty_bridge"
crate-type = ["cdylib", "rlib"]

[features]
default = []
bridge-perf = ["truehd/perf"]
# IAMF (AOMedia Immersive Audio Model and Formats) through iamf-rs. Off by
# default: its Opus decoding links libopus (pkg-config, or OPUS_LIB_DIR), and
# the Windows and macOS release builds do not provide one yet. The pure-Rust
# Opus decoder iamf-rs also offers is far below realtime on real content.
iamf = ["dep:iamf-obu", "dep:iamf-dec", "dep:iamf-codecs"]

# Path deps reach out of the workspace to the sibling Omniphony checkout:
# `bridge/../../Omniphony` is the workflow symlink locally and the second
# checkout in CI.
[dependencies]
bridge_api = { version = "0.4.0", path = "../../Omniphony/omniphony-renderer/bridge_api" }
spdif = { version = "0.1.0", path = "../../Omniphony/omniphony-renderer/spdif" }
sys = { version = "0.1.0", path = "../../Omniphony/omniphony-renderer/sys" }
truehd = { version = "0.7.2" }
eac3 = { version = "0.8.0", path = "../eac3" }
dca = { version = "0.8.0", path = "../dca" }
auro = { version = "0.8.0", path = "../auro" }
abi_stable = "0.11"
log = "0.4"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
# iamf-rs is not on crates.io: pinned to a reviewed commit of harletty's fork,
# which adds IAMF v2.0 object passthrough and an allocation-free f32 output
# path to baylesj/iamf-rs, puts a parameter tick on one sample when the
# rates agree, and renders the expanded loudspeaker layouts (9.1.6,
# 10.2.9.3, 7.1.5.4 and their subsets).
iamf-obu = { git = "https://github.com/harletty/iamf-rs", rev = "29e4793a8c85a8a24341c153acd49ac84b6ca1a5", optional = true }
iamf-dec = { git = "https://github.com/harletty/iamf-rs", rev = "29e4793a8c85a8a24341c153acd49ac84b6ca1a5", default-features = false, optional = true }
iamf-codecs = { git = "https://github.com/harletty/iamf-rs", rev = "29e4793a8c85a8a24341c153acd49ac84b6ca1a5", default-features = false, features = ["pcm", "flac", "aac", "opus-ffi"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1.0.142"
