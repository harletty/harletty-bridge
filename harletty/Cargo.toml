[package]
name = "harletty"
# Every crate in the workspace shares one version line: they all come from a
# single commit and are tagged together, so a release number means the same
# thing everywhere. Bump them together or not at all.
version = "0.7.3"
edition = "2024"
license = "Apache-2.0"
description = "Offline decoder for TrueHD, E-AC-3 JOC and DTS bitstreams, writing Dolby Atmos master files"
repository = "https://github.com/harletty/harletty-bridge"
build = "build.rs"
authors = ["Rainbaby"]
rust-version = "1.87.0"

[[bin]]
name = "harletty"
path = "src/main.rs"

# Decoder crates + the offline writers. Nothing here may depend on the
# Omniphony bridge ABI: this stays a pure offline tool. CI asserts the mirror
# invariant (no damf/clap/indicatif reachable from harletty-bridge).
[dependencies]
truehdd-macros = "0.1.1"
truehd = { version = "0.6.3", features = ["perf"] }
eac3 = { version = "0.7.3", path = "../eac3" }
dca = { version = "0.7.3", path = "../dca" }
damf = { version = "0.7.3", path = "../damf" }

anyhow = "1.0.99"
clap = { version = "4.5.45", features = ["derive"] }
env_logger = "0.11.8"
indicatif = "0.18.0"
indicatif-log-bridge = "0.2.3"
log = "0.4.27"
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml_ng = "0.10.0"

[dev-dependencies]
sha2 = "0.10"

[build-dependencies]
anyhow = "1.0.99"
vergen-gitcl = { version = "1.0.8", default-features = false, features = ["build"] }
chrono = "0.4.41"
serde_json = "1.0.142"
