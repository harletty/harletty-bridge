[package]
name = "eac3"
version = "0.9.0"
edition = "2024"
license = "Apache-2.0"
description = "Independent E-AC-3 bitstream parser and frame extractor"
repository = "https://github.com/harletty/harletty-bridge"
authors = ["Rainbaby"]
rust-version = "1.89.0"
# A diff against FFmpeg (LGPL-2.1-or-later) kept only as a local test oracle;
# it is not part of the published crate.
exclude = ["examples/ffmpeg-bittrace.patch"]

[lib]
name = "eac3"
crate-type = ["lib"]

[dependencies]
log = "0.4"
rustfft = "6.4"
thiserror = "2.0"
