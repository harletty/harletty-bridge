# Fallback fold for a standard-profile DTS:X frame whose type-2 fold matrix
# could not be read: the four height feeds' contribution to the compatible
# 7.1 bed. Every stream examined states code 55 (Q15 23170/32768) here. A
# `dts-fold.yaml` in the working directory overrides this bundled default.
# Alternate profiles carry their folds in per-frame metadata and ignore the
# `sources` list.
#
# `render_unstated`: an object record without reference rows says the
# encoder panned the object into the bed from its position; its fold is
# recomputed with that renderer and subtracted, so it plays at its position
# and leaves the bed.
# `estimate_unknown`: a waveform whose fold is still unknown after that
# (render off, or a bed layout the renderer cannot cover) has its fold
# measured from the bed's own audio, frame by frame.
# With both false such a waveform stays in the bed and its channel is muted.
render_unstated: true
estimate_unknown: true
sources:
  - source: TFL
    routes: [{target: L, gain_db: -3.0104780234}]
  - source: TFR
    routes: [{target: R, gain_db: -3.0104780234}]
  - source: TBL
    routes: [{target: Lb, gain_db: -3.0104780234}]
  - source: TBR
    routes: [{target: Rb, gain_db: -3.0104780234}]
