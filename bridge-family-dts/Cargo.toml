[package]
name = "bridge-family-dts"
version = "0.8.0"
edition = "2024"
# Links bridge_api, like ../bridge: see the note there.
license = "GPL-3.0-or-later"
description = "The DTS codec family of harletty-bridge: DTS core, DTS-HD, DTS:X and Auro-3D over DTS-HD MA"
repository = "https://github.com/harletty/harletty-bridge"
publish = false

[dependencies]
bridge_api = { version = "0.6.0", path = "../../Omniphony/omniphony-renderer/bridge_api" }
bridge-common = { version = "0.8.0", path = "../bridge-common" }
dca = { version = "0.8.0", path = "../dca" }
auro = { version = "0.8.0", path = "../auro" }
abi_stable = "0.11"
log = "0.4"
# The DTS:X fold table (dts-fold.yaml), read at bridge creation.
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
