name: CI

# Integration gate on every push/PR to main: build with warnings denied and
# run the full test suite. Introduced as phase 1 of the channel/object
# contract (Omniphony docs/channel-object-contract.md) — the previous
# `ci.yml` was in fact the tag-triggered Release bundle (now
# `release.yml`), so branch pushes ran no CI at all.
#
# `cargo fmt --check` is intentionally not gated yet: the tree predates
# rustfmt and a whole-repo reformat would conflict with the in-flight
# `research/spatial-object-layer` branch. Gate it after that branch lands.
#
# `cargo test` covers both artifacts since the root became a virtual
# workspace, including the truehdd CLI's golden-file regression
# (truehdd/tests/golden.rs).
#
# The bridge builds against a checkout of Omniphony (path dependencies on
# `../Omniphony`), normally its `main`. A pull request whose Omniphony side
# is not merged yet can name the ref to build against in a file
# `.omniphony-ref` at the repository root — one line, a branch, tag or SHA
# of mgth/Omniphony — and its CI runs against that instead. The file is for
# pull requests only: remove it before merging, once the Omniphony side is
# on `main`. A push to `main` that still carries one fails on purpose,
# because `main` would then be tested against something `main` is not
# built with.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout harletty-bridge
        uses: actions/checkout@v4
        with:
          path: harletty-bridge

      # `main` unless the branch names another ref in `.omniphony-ref` (see
      # the header). Blank lines and `#` comments in the file are ignored;
      # the first remaining line is the ref.
      - name: Resolve the Omniphony ref
        id: omniphony
        shell: bash
        run: |
          ref=main
          if [ -f harletty-bridge/.omniphony-ref ]; then
            ref=$(grep -v -E '^\s*(#|$)' harletty-bridge/.omniphony-ref | head -n 1 | tr -d '[:space:]')
            if [ -z "$ref" ]; then
              echo "::error file=.omniphony-ref::.omniphony-ref is present but names no ref"
              exit 1
            fi
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::error file=.omniphony-ref::.omniphony-ref (${ref}) is only for pull requests; remove it before merging"
              exit 1
            fi
            echo "::notice file=.omniphony-ref::building against mgth/Omniphony@${ref} (remove the file before merging)"
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout Omniphony (path dependencies)
        uses: actions/checkout@v4
        with:
          repository: mgth/Omniphony
          ref: ${{ steps.omniphony.outputs.ref }}
          path: Omniphony

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --all-targets
        working-directory: harletty-bridge
        env:
          RUSTFLAGS: -D warnings

      - name: Test
        run: cargo test
        working-directory: harletty-bridge
        env:
          RUSTFLAGS: -D warnings

      # dca picks its vector code from the CPU it runs on, so the run above
      # tests whatever the runner has (AVX2, or AVX-512 on some hosts). Test
      # the portable and the AVX2 code on every run as well (`dca/src/cpu.rs`);
      # `tests/fixture_decode.rs` checks they decode to the same samples.
      - name: Test dca on its portable code
        run: cargo test -p dca
        working-directory: harletty-bridge
        env:
          RUSTFLAGS: -D warnings --cfg dca_force_scalar

      - name: Test dca on its AVX2 code
        run: cargo test -p dca
        working-directory: harletty-bridge
        env:
          RUSTFLAGS: -D warnings --cfg dca_force_avx2

      # The bridge-perf timing path is compiled by nothing else — it rotted
      # unnoticed once already (#31) — so keep it building.
      - name: Check bridge-perf feature
        run: cargo check -p harletty-bridge --features bridge-perf --all-targets
        working-directory: harletty-bridge
        env:
          RUSTFLAGS: -D warnings

      # IAMF is opt-in (its Opus path links libopus, which the Windows and
      # macOS release builds do not provide yet), so the default build above
      # never compiles it: bridge-family-iamf is left out of the workspace's
      # default members. The decode tests against the libiamf conformance
      # vectors skip here: they need HARLETTY_IAMF_VECTORS.
      - name: Install libopus
        run: sudo apt-get update && sudo apt-get install -y libopus-dev

      - name: Test iamf feature
        run: cargo test -p harletty-bridge -p bridge-family-iamf --features harletty-bridge/iamf
        working-directory: harletty-bridge
        env:
          RUSTFLAGS: -D warnings

      # The bridge built from the IAMF family alone: what it refuses, and that
      # it builds at all without the Dolby and DTS crates. The crate-isolation
      # step below checks that its graph holds none of their decoders.
      - name: Test IAMF-only bridge
        run: cargo test -p harletty-bridge --no-default-features --features iamf
        working-directory: harletty-bridge
        env:
          RUSTFLAGS: -D warnings

      # Every family can be left out: keep the one-family builds compiling.
      - name: Check single-family bridges
        run: |
          cargo check -p harletty-bridge --no-default-features --features dolby --all-targets
          cargo check -p harletty-bridge --no-default-features --features dts --all-targets
        working-directory: harletty-bridge
        env:
          RUSTFLAGS: -D warnings

      # The workspace builds two artifacts — the realtime plugin and the
      # offline truehdd CLI — and their isolation is by crate graph, not
      # feature flags. Nothing in a normal build or test run would notice the
      # boundary being crossed, so it is asserted explicitly.
      - name: Check crate-graph isolation
        run: ./scripts/check-crate-isolation.sh
        working-directory: harletty-bridge

  # The fuzz crates (eac3/fuzz, dca/fuzz, bridge/fuzz) are workspaces of
  # their own, so nothing above compiles them: build every target here so
  # they cannot rot. `fuzz.yml` runs them, weekly. Each crate is built
  # against the root Cargo.lock, the dependency versions the bridge ships.
  fuzz-build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout harletty-bridge
        uses: actions/checkout@v4
        with:
          path: harletty-bridge

      # As in test-linux, which also fails a push to `main` that still
      # carries the file.
      - name: Resolve the Omniphony ref
        id: omniphony
        shell: bash
        run: |
          ref=main
          if [ -f harletty-bridge/.omniphony-ref ]; then
            ref=$(grep -v -E '^\s*(#|$)' harletty-bridge/.omniphony-ref | head -n 1 | tr -d '[:space:]')
          fi
          echo "ref=${ref:-main}" >> "$GITHUB_OUTPUT"

      - name: Checkout Omniphony (path dependencies)
        uses: actions/checkout@v4
        with:
          repository: mgth/Omniphony
          ref: ${{ steps.omniphony.outputs.ref }}
          path: Omniphony

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo-fuzz
        id: cargo-fuzz
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.2-${{ runner.os }}

      - name: Install cargo-fuzz
        if: steps.cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      # The IAMF family's Opus path links libopus.
      - name: Install libopus
        run: sudo apt-get update && sudo apt-get install -y libopus-dev

      - name: Build fuzz targets
        shell: bash
        working-directory: harletty-bridge
        run: |
          for crate in eac3 dca bridge; do
            cp Cargo.lock "$crate/fuzz/Cargo.lock"
          done
          (cd eac3/fuzz && cargo fuzz build)
          (cd dca/fuzz && cargo fuzz build)
          (cd bridge/fuzz && cargo fuzz build --features iamf)
