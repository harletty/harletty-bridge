[package]
name = "damf"
version = "0.7.4"
edition = "2024"
license = "Apache-2.0"
description = "Dolby Atmos Master File (DAMF) metadata writer plus CAF/WAV container writers"
repository = "https://github.com/harletty/harletty-bridge"
authors = ["Rainbaby"]
rust-version = "1.87.0"

[lib]
name = "damf"
crate-type = ["lib"]

# `truehd` only for the OAMD payload types the DAMF metadata is projected from.
# Nothing here may depend on the bridge ABI or on any CLI crate.
[dependencies]
truehdd-macros = "0.1.1"
truehd = { version = "0.7.1" }
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
