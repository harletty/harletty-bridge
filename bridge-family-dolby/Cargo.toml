[package]
name = "bridge-family-dolby"
version = "0.9.0"
edition = "2024"
# Links bridge_api, like ../bridge: see the note there.
license = "GPL-3.0-or-later"
description = "The Dolby codec family of harletty-bridge: TrueHD (raw and MAT) and E-AC-3 / AC-3 with JOC objects"
repository = "https://github.com/harletty/harletty-bridge"
publish = false

[features]
# Per-stage timings of the TrueHD and E-AC-3 paths (TRUEHD_BRIDGE_PERF_*).
bridge-perf = ["truehd/perf"]

[dependencies]
bridge_api = { version = "0.6.0", path = "../../Omniphony/omniphony-renderer/bridge_api" }
bridge-common = { version = "0.9.0", path = "../bridge-common" }
truehd = { version = "0.7.2" }
eac3 = { version = "0.9.0", path = "../eac3" }
abi_stable = "0.11"
log = "0.4"
