[package]
name = "bridge-family-iamf"
version = "0.8.0"
edition = "2024"
# Links bridge_api, like ../bridge: see the note there.
license = "GPL-3.0-or-later"
description = "The IAMF codec family of harletty-bridge: OBU framing, iamf-rs decoding, the 7.1.4 / 9.1.6 bed and IAMF v2.0 objects"
repository = "https://github.com/harletty/harletty-bridge"
publish = false

# Its Opus decoding links libopus (pkg-config, or OPUS_LIB_DIR). The pure-Rust
# Opus decoder iamf-rs also offers is far below realtime on real content.
[dependencies]
bridge_api = { version = "0.6.0", path = "../../Omniphony/omniphony-renderer/bridge_api" }
bridge-common = { version = "0.8.0", path = "../bridge-common" }
abi_stable = "0.11"
log = "0.4"
# iamf-rs is not on crates.io: pinned to a reviewed commit of harletty's fork,
# which adds IAMF v2.0 object passthrough and an allocation-free f32 output
# path to baylesj/iamf-rs, puts a parameter tick on one sample when the rates
# agree, renders the expanded loudspeaker layouts (9.1.6, 10.2.9.3, 7.1.5.4
# and their subsets), and hands a channel-based element out in its own
# layout (the dialogue element, tagged for the renderer).
iamf-obu = { git = "https://github.com/harletty/iamf-rs", rev = "dab1c71d0f7198dd5ac644bd6fafb62f49e2c160" }
iamf-dec = { git = "https://github.com/harletty/iamf-rs", rev = "dab1c71d0f7198dd5ac644bd6fafb62f49e2c160", default-features = false }
iamf-codecs = { git = "https://github.com/harletty/iamf-rs", rev = "dab1c71d0f7198dd5ac644bd6fafb62f49e2c160", default-features = false, features = ["pcm", "flac", "aac", "opus-ffi"] }
